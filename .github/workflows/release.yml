name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, attest, and release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install release dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Resolve tag version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          test "${TAG}" = "v${version}"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Download passing security gate for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/supply-chain.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=20" \
              --jq '.workflow_runs[0].id'
          )"
          test -n "${run_id}" && test "${run_id}" != "null"
          gh run download "${run_id}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "security-release-report-${GITHUB_SHA}" \
            --dir security-release-evidence

      - name: Run blocking release checklist
        run: |
          python scripts/release_check.py \
            --version "${{ steps.version.outputs.version }}" \
            --tag "${{ github.ref_name }}" \
            --security-artifacts security-release-evidence

      - name: Create release artifact directory
        run: mkdir -p release-artifacts

      - name: Generate Python distribution SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: release-artifacts/python-dist.spdx.json
          upload-artifact: false

      - name: Build Docker image
        id: docker
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH_GHCR: ${{ vars.PUBLISH_GHCR }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image="sacm-agent-runtime:${VERSION}"
          docker build \
            --build-arg VERSION="${VERSION}" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "${image}" .
          image_id="$(docker image inspect --format '{{.Id}}' "${image}")"
          printf '{"image":"%s","image_id":"%s","published":false}\n' \
            "${image}" "${image_id}" > release-artifacts/docker-image.json
          echo "published=false" >> "${GITHUB_OUTPUT}"

          if [ "${PUBLISH_GHCR}" = "true" ]; then
            repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
            remote="ghcr.io/${repository}:${VERSION}"
            printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            docker tag "${image}" "${remote}"
            docker push "${remote}"
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${remote}")"
            digest="${digest#*@}"
            printf '{"image":"%s","digest":"%s","published":true}\n' \
              "${remote}" "${digest}" > release-artifacts/docker-image.json
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "image=${remote}" >> "${GITHUB_OUTPUT}"
            echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Generate Docker image SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: sacm-agent-runtime:${{ steps.version.outputs.version }}
          format: spdx-json
          output-file: release-artifacts/docker-image.spdx.json
          upload-artifact: false

      - name: Assemble and sign release manifest
        run: |
          cp security-release-evidence/release-security-report.signed.json \
            release-artifacts/
          find dist release-artifacts -type f \
            ! -name 'SHA256SUMS*' -print0 |
            sort -z |
            xargs -0 sha256sum > release-artifacts/SHA256SUMS
          openssl genpkey -algorithm ED25519 -out release-signing-key.pem
          openssl pkey -in release-signing-key.pem -pubout \
            -out release-artifacts/SHA256SUMS.pem
          openssl pkeyutl -sign -rawin \
            -inkey release-signing-key.pem \
            -in release-artifacts/SHA256SUMS \
            -out release-artifacts/SHA256SUMS.sig
          rm release-signing-key.pem

      - name: Attest Python distributions and release manifest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            release-artifacts/SHA256SUMS
            release-artifacts/python-dist.spdx.json
            release-artifacts/docker-image.spdx.json

      - name: Attest published GHCR image
        if: steps.docker.outputs.published == 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.docker.outputs.image }}
          subject-digest: ${{ steps.docker.outputs.digest }}
          push-to-registry: true

      - name: Publish to PyPI only when explicitly configured
        env:
          PUBLISH_PYPI: ${{ vars.PUBLISH_PYPI }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ "${PUBLISH_PYPI}" != "true" ]; then
            echo "PyPI publishing is disabled."
            exit 0
          fi
          test -n "${TWINE_PASSWORD}"
          python -m pip install --disable-pip-version-check "twine==6.1.0"
          python -m twine upload --non-interactive dist/*

      - name: Preserve release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/
            release-artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="docs/releases/v${VERSION}.md"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* release-artifacts/* \
              --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "SACM Agent Runtime ${VERSION}" \
              --notes-file "${notes}"
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --verify-tag --draft \
              --title "SACM Agent Runtime ${VERSION}" \
              --notes-file "${notes}"
            gh release upload "${TAG}" dist/* release-artifacts/* \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --draft=false --latest
          fi
