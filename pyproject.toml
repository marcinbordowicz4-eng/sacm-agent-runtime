[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sacm-agent-runtime"
version = "0.2.0"
description = "Secure, auditable software-delivery control plane for policy-governed coding agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.2.4",
    "redis>=5.0.0",
    "torch>=2.6.0",
    "sentence-transformers>=2.5.0",
    "gitpython>=3.1.40",
    "httpx>=0.26.0",
    "mcp>=1.0.0,<2.0.0",
    "langchain-core>=0.3.0",
    "langchain-postgres>=0.0.12",
    "langsmith>=0.3.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-exporter-otlp-proto-http>=1.26.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0,<2",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
agents = [
    "openai-agents>=0.0.16",
]
mlflow = [
    "mlflow>=2.14.0",
]
temporal = [
    "temporalio>=1.7.0",
]
github-app = [
    "PyJWT[crypto]>=2.8.0",
]
auth = [
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=50.0.0",
]
secrets-aws = [
    "boto3>=1.34.0",
]
secrets-azure = [
    "azure-identity>=1.17.0",
    "azure-keyvault-secrets>=4.8.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "httpx>=0.26.0",
    "build>=1.2.0",
]

[project.scripts]
sacm = "cli.main:app"
sacm-mcp = "sacm.mcp_server:main"
sacm-worker = "apps.worker.main:main"
sacm-temporal-worker = "sacm.workflows.temporal_worker:main"
sacm-migrate = "sacm.migrate:main"
sacm-customer-executor = "sacm.customer_executor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["apps", "cli", "sacm"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "security_release_gate: deterministic adversarial tests required by the release security policy",
]
