environment: production
control_plane_url: https://sacm-control.example.internal
state_dir: /var/lib/sacm-executor/identity
workspace_root: /var/lib/sacm-executor/workspaces
executor_identity: customer-prod-executor-01
display_name: Customer production executor 01
version: 0.2.0
runtime_kind: kubernetes-gvisor
sandbox_runtime: runsc
sandbox_verified: true
capabilities:
  - agent-task/v1
labels:
  region: eu-west
runner_command:
  - /usr/local/bin/customer-approved-sandbox-runner
  - --contract
  - "{input}"
  - --result
  - "{output}"
  - --workspace
  - "{workspace}"
  - --repository
  - "{repository}"
repository_map:
  acme/service: /srv/customer-repositories/service
network_boundary:
  schema_version: executor-network-boundary/v1
  deployment_type: on-premises
  boundary_id: acme-production
  residency_region: eu-west
  outbound_allowlist:
    - sacm-control.example.internal
  proxy_url: null
  metadata_service_blocked: true
  private_control_plane: true
  tls:
    ca_bundle: /etc/sacm-executor/customer-ca.pem
    client_certificate: /etc/sacm-executor/client.pem
    client_key: /etc/sacm-executor/client-key.pem
    server_certificate_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    signing_key_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
capacity:
  max_concurrent_jobs: 1
  cpu_units: 2000
  memory_mb: 4096
poll_seconds: 5
heartbeat_seconds: 30
lease_seconds: 120
health_bind: 127.0.0.1
health_port: 8787
